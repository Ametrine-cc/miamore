[package]
name = "miamore"
version = "0.2.1"
authors = [
    "Noticxs <noticxs@ametrine.cc>",
    "Ametrine Foundation <business@ametrine.cc>"
]
edition = "2024"
description = "A lightweight C TUI Library. These are the official Rust bindings for miamore"
license = "LGPL-3.0"
repository = "https://github.com/Ametrine-cc/miamore"
readme = "README.md"

include = [
    "src/**/*",
    "Makefile",
    "build.rs",
    "bindings/**/*",
    "README.md",
    "LICENSE",
    "COPYING.LESSER"
]

[lib]
path = "bindings/rust/miamore.rs"

[build-dependencies]
bindgen = "0.70.1"
cc = "1.0"
